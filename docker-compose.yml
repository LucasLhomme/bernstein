name: poll-application

x-postgres-env: &postgres-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-polls}
  POSTGRES_USER: ${POSTGRES_USER:-polls}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polls}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-polls}

services:
  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-polls}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-polls}
    networks:
      - backend
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polls}
      POSTGRES_USER: ${POSTGRES_USER:-polls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polls}
    volumes:
      - db-data:/var/lib/postgresql
      - ./poll/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  poll:
    build: ./poll
    environment:
      <<: *redis-env
    ports:
      - "8080:80"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      <<: [*redis-env, *postgres-env]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  result:
    build: ./result
    environment:
      <<: *postgres-env
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  db-data:

networks:
  frontend:
  backend:
