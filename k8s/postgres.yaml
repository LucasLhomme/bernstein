apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres

spec:
  # Strictement 1 : PostgreSQL n'est pas multi-maître et le volume est en ReadWriteOnce.
  replicas: 1
  # Recreate : l'ancien pod libère le disque avant que le nouveau ne l'attache (pas de "Multi-Attach error").
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres

# modèle du pod créé par le Deployment
  template:
    metadata:
      labels:
        app: postgres

    spec:
      restartPolicy: Always
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432

# chargement de l'env
          env:
            - name: POSTGRES_DB
              value: "polls"
            - name: POSTGRES_USER
              value: "polls"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "polls", "-d", "polls"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "polls", "-d", "polls"]
            initialDelaySeconds: 15
            periodSeconds: 10
          # Montage des volumes
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql

# ici on définit les volumes pour le container, soit un PVC pour la persistance des données, soit un ConfigMap pour l'initialisation de la base de données
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-schema
---
# Disque persistant des données PostgreSQL (survit à la suppression du pod)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Service interne (ClusterIP) : PostgreSQL n'est joignable que depuis le cluster
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432