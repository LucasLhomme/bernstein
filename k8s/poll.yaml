apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  labels:
    app: poll
spec:
  # Pas de "replicas" : c'est le HPA (hpa.yaml) qui gère le nombre de pods entre 2 et 10.
  # Le fixer ici le remettrait à 2 à chaque "kubectl apply", même en pleine montée en charge.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: poll
  template:
    metadata:
      labels:
        app: poll
    spec:
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - poll
                topologyKey: "kubernetes.io/hostname"
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: poll
          image: ghcr.io/bernstein-epitech-lille-01/bernstein-poll:v1
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              value: "redis"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: poll
  labels:
    app: poll
spec:
  type: LoadBalancer
  selector:
    app: poll
  ports:
    - port: 80
      targetPort: 80
---
# Pendant un "kubectl drain" (maintenance d'un nœud), Kubernetes refuse d'évincer
# un pod poll si cela laisse moins de 1 pod disponible.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: poll-pdb
  labels:
    app: poll
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: poll