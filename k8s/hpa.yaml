apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poll-hpa
  labels:
    app: poll
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poll
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-hpa
  labels:
    app: result
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

